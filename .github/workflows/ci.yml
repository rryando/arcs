name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git.test.ts needs history (HEAD~1)

      # Single latest-stable Node only — we do not support older lines.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build before test: scripts/arcs-cli.mjs imports from dist/.
      - name: Build (incl. opencode bundle)
        run: npm run build:opencode-bundle

      - name: Test
        run: npm test

      - name: Lint opencode bundle
        run: node scripts/lint-bundle.mjs
